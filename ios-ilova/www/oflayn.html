<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Balansa — ulanish yo'q</title>
    <style>
      :root {
        color-scheme: light dark;
        --fon: #ffffff;
        --matn: #0f172a;
        --xira: #64748b;
        --brend: #0f766e;
        --chegara: #e2e8f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fon: #061413;
          --matn: #f1f5f9;
          --xira: #94a3b8;
          --brend: #5eead4;
          --chegara: #1e293b;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: var(--fon);
        color: var(--matn);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .quti { max-width: 340px; text-align: center; }
      .belgi {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 18px;
        background: var(--brend);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        font-weight: 700;
      }
      h1 { font-size: 20px; margin: 0 0 8px; font-weight: 700; }
      p { margin: 0 0 24px; font-size: 15px; line-height: 1.5; color: var(--xira); }
      button {
        width: 100%;
        padding: 14px;
        font-size: 16px;
        font-weight: 600;
        font-family: inherit;
        color: #fff;
        background: #0f766e;
        border: 0;
        border-radius: 12px;
        cursor: pointer;
      }
      button:active { opacity: 0.8; }
      .maslahat { margin-top: 16px; font-size: 13px; color: var(--xira); }
    </style>
  </head>
  <body>
    <div class="quti">
      <div class="belgi">B</div>
      <h1>Internet ulanmadi</h1>
      <p>
        Balansa ma'lumotlari serverda saqlanadi. Wi-Fi yoki mobil internetni
        yoqib, qaytadan urinib ko'ring.
      </p>
      <button type="button" onclick="location.reload()">Qayta urinish</button>
      <p class="maslahat">Ulanish tiklanishi bilan ilova o'zi ochiladi.</p>
    </div>
    <script>
      // Ulanish tiklansa qo'lda bosish shart emas.
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
