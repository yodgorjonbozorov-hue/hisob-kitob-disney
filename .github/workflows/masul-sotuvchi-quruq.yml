# MAS'UL → SOTUVCHI MIGRATSIYASI — FAQAT QURUQ (dry-run) HISOBOT.
#
# Bazaga YOZMAYDI: skript `--qollash` bayrog'isiz faqat SELECT bajaradi va
# nechta zakaz ko'chishi/nega o'tkazib yuborilishini sanaydi. Repozitoriya
# ommaviy — `CI` muhitida biznes nomlari chiqmaydi (id boshlanishi chiqadi).
#
# Ishga tushirish: Actions -> "Mas'ul→sotuvchi (quruq)" -> Run
name: Mas'ul→sotuvchi (quruq)

on:
  workflow_dispatch:

concurrency:
  group: masul-sotuvchi-quruq
  cancel-in-progress: true

jobs:
  quruq:
    name: Quruq hisobot (yozmaydi)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Bog'liqliklar
        run: npm ci

      - name: Quruq hisobot (faqat SELECT)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
        run: node -r ts-node/register scripts/masul-sotuvchi-migratsiya.ts
